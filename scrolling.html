/* Responsive fit. Landscape: the 1920×1080 comp covers the screen (as before). */
/* Portrait (phones): the comp is shown 1150 px wide and the scenes are re-composed for the tall frame: positions are
   spread vertically and drawn in horizontally (PORT.ax / PORT.ay), shapes keep their size, text breaks into lines. */
window.PORT={on:false,ax:1,ay:1,hc:540};
window.FITK=(w,h)=>{
  if(h>w*1.05){const k=w/1150,hc=h/k/2;PORT.on=true;PORT.ax=.56;PORT.ay=Math.max(1,Math.min(2.1,(hc-150)/540));PORT.hc=hc;return k;}
  PORT.on=false;PORT.ax=PORT.ay=1;PORT.hc=540;return Math.max(w/1920,h/1080);};
FITK(innerWidth,innerHeight);
const setPortCls=()=>{FITK(innerWidth,innerHeight);document.documentElement.classList.toggle('port',PORT.on);};
addEventListener('resize',setPortCls);document.addEventListener('DOMContentLoaded',setPortCls);

<script>
/* ============================== Timeline controller ==============================
   One gesture (click, scroll, swipe, key) starts each section; each section then rests in a gentle loop
   until the next gesture.
   SC01 waits at frame 33 → [gesture] the line leaves, burst, "boldly" settles → rests on "boldly"
   → [gesture] zoom and SC02 play straight through → SC02 loops (once its text has settled)
   → SC03 runs at 12 fps
   → [gesture] SC03: the shapes peel off into the wave string, camera pans and zooms out → SC03 drifts on the wave
   → [gesture] SC04 part 1: zoom into the asterisk → rests → [gesture] SC04 part 2 (tree) → rests. */
// Shared wave path (Cavalry "Wave path (string)": amplitude 330, wavelength 2800), as a fine polyline with arc lengths
window.WAVE=(()=>{
  const A=330, LAM=2800, X0=367-Math.asin(-118/330)*LAM/(2*Math.PI), XMIN=-9000, XMAX=25860, STEP=20;
  const n=Math.round((XMAX-XMIN)/STEP)+1, X=new Float64Array(n), Y=new Float64Array(n), S=new Float64Array(n);
  for(let i=0;i<n;i++){X[i]=XMIN+i*STEP;Y[i]=A*Math.sin(2*Math.PI*(X[i]-X0)/LAM);if(i)S[i]=S[i-1]+Math.hypot(X[i]-X[i-1],Y[i]-Y[i-1]);}
  const len=S[n-1];
  function at(s){                      // point and tangent angle at arc length s
    s=Math.max(0,Math.min(len,s));
    let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(S[m]<s)lo=m;else hi=m;}
    const t=(s-S[lo])/Math.max(1e-6,S[hi]-S[lo]);
    return {x:X[lo]+(X[hi]-X[lo])*t,y:Y[lo]+(Y[hi]-Y[lo])*t};
  }
  let d='M'+X[0]+' '+(-Y[0]).toFixed(1);for(let i=1;i<n;i++)d+='L'+X[i]+' '+(-Y[i]).toFixed(1);   // SVG (y down)
  function arcAtX(x){const i=Math.max(0,Math.min(n-1,Math.round((x-XMIN)/STEP)));return S[i];}
  return {len,at,d,arcAtX};
})();

window.SCN=(()=>{
  /* SCRUB VERSION — after the first click (which plays the burst), the whole card is one timeline driven by scrolling:
     scroll down = forward, up = back; the faster you scroll, the more you see. Timeline (frames, 25 fps):
       59–342   SC01 burst → zoom → SC02 (main)          342–622  SC03 (L 190 → 470)
       622–722  SC03 string drifting on its own (4 s)     722–807  zoom into the asterisk (p4 0 → 1)
       807–1081 SC04 (its quiet star drift 80–186 runs 3× so nothing stalls)                                   */
  const FPS=25, IDLE=59, B1=128, SC2_START=152, SC2_HOLD=190, SC3_HOLD=470;
  const T3=SC2_START+SC3_HOLD, TA=T3+100, TZ=TA+85, TEND=TZ+274;
  const S={main:0,state:'intro',sc2Alpha:0,renderers:[],FPS,SC2_START,SC2_HOLD,SC3_HOLD,
           L:0,fr:0,amb:0,p4:0,m4:0,t:0,hold1:0,rate:1,txt2Done:true,scrub:false,F4:0,R4:0,entT:0};
  const hint=document.getElementById('hint'), hintT=document.getElementById('hintT');
  function setHint(text,on){hintT.textContent=text;hint.classList.toggle('on',on);hint.classList.toggle('scroll',on);}
  S.setHint=setHint;
  let T=IDLE, target=IDLE, lastInput=0;
  function apply(T){
    S.main=Math.min(T,SC2_START+SC2_HOLD);
    S.L=T<=SC2_START+SC2_HOLD?Math.max(0,T-SC2_START):Math.min(SC3_HOLD,T-SC2_START);
    S.amb=T<=T3?0:Math.min(4,(T-T3)/FPS);
    S.p4=T<=TA?0:Math.min(1,(T-TA)/85);
    S.fr=Math.max(0,T-SC2_START);
    const u=Math.max(0,T-TZ);
    S.F4=u<=80?u:u<=115?80+(u-80)*106/35:Math.min(345,186+(u-115));
    S.R4=u;
    S.entT=S.p4<.15?0:(T-TA-.15*85)/FPS;
    S.sc2Alpha=Math.max(0,Math.min(1,(S.main-SC2_START)/20));
  }
  function nudge(frames){
    if(!S.scrub)return;
    target=Math.max(IDLE,Math.min(TEND,target+frames));lastInput=performance.now();setHint('',false);
  }
  function replay(){S.state='replaying';setHint('',false);document.body.style.transition='opacity .45s ease';document.body.style.opacity='0';
    setTimeout(()=>location.reload(),480);}
  // the first interaction is a click on the orange shape only; after the burst, scrolling drives everything
  addEventListener('click',e=>{if(e.button!==0)return;
    if(S.state==='idle'){S.state='play1';setHint('',false);}
    else if(S.scrub&&T>=TEND-.5)replay();});
  addEventListener('wheel',e=>{e.preventDefault();
    const k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
    nudge((e.deltaY+e.deltaX)*k/24);          // ~24 px of scrolling = one frame
  },{passive:false});
  let ty=null;
  addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
  addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY;if(ty!==null)nudge((ty-y)/10);ty=y;},{passive:false});
  addEventListener('keydown',e=>{
    if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();nudge(e.key==='PageDown'||e.key===' '?50:10);}
    if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();nudge(e.key==='PageUp'?-50:-10);}
    if(e.key==='Enter'&&S.state==='idle'){S.state='play1';setHint('',false);}
  });
  let last=performance.now();
  function tick(now){
    const dt=Math.min((now-last)/1000,0.1);last=now;S.t+=dt;
    const st=S.state;
    if(st==='intro'){S.main+=dt*FPS;if(S.main>=IDLE){S.main=IDLE;S.state='idle';setHint('Click',true);}apply(Math.min(S.main,IDLE));S.main=Math.min(S.main,IDLE);}
    else if(st==='idle'){apply(IDLE);}
    else if(st==='play1'){T+=dt*FPS;if(T>=B1){T=B1;target=B1;S.state='scrub';S.scrub=true;lastInput=0;}apply(T);}
    else if(st==='scrub'){
      T+=(target-T)*(1-Math.exp(-dt*9));if(Math.abs(target-T)<.02)T=target;
      apply(T);
      if(T>=TEND-.5)setHint('Click to replay',true);
      else if(now-lastInput>1300&&Math.abs(target-T)<.5&&!hint.classList.contains('on'))setHint('Scroll',true);
    }
    hint.classList.toggle('light',S.main>=SC2_START&&S.L>272&&S.p4<.6);
    for(const r of S.renderers)r(dt,now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return S;
})();
</script>

function blurShape(ctx,T0,xf,k,alpha,sigma,stroke,col){
  if(alpha<=0.002)return;
  const kk=T0[0], OFF=ctx.canvas.width+4*sigma*kk+400;
  ctx.save();
  ctx.setTransform(kk,0,0,-kk,T0[1]-OFF,T0[2]);
  for(const t of xf){ctx.translate(t.x,t.y);ctx.rotate(t.r*Math.PI/180);ctx.scale(t.s,t.s);}
  if(RMX!==1||RMY!==1||OFFY){const m=ctx.getTransform(),wx=(m.e-(T0[1]-OFF))/kk,wy=(T0[2]-m.f)/kk;
    ctx.setTransform(m.a,m.b,m.c,m.d,m.e+wx*(RMX-1)*kk,m.f-(wy*(RMY-1)+OFFY)*kk);}
  ctx.shadowOffsetX=OFF;ctx.shadowOffsetY=0;
  ctx.shadowBlur=Math.max(0,2*sigma*kk);

  if(stroke){ctx.lineWidth=stroke;ctx.lineCap='butt';ctx.strokeStyle='#000';ctx.stroke();}
  else{ctx.fillStyle='#000';ctx.fill();}

}

// Each one starts exactly on the main string — same shapes at the same places, moving with it — and invisible.
// As it parts (own height, angle, depth, and its own flow along the wave) it fades in, then settles further away.
function drawGhostStrings(L,fr,amb,cam,arc){
  gsx.setTransform(1,0,0,1,0,0);gsx.clearRect(0,0,gsc.width,gsc.height);
  if(L<320)return;
  const gt=L/25+amb;
  const k0=fitCss*gq, T0=[k0,gsc.width/2,gsc.height/2], fade=1-sstep(.05,.45,SCN.p4);
  GL.forEach((g,gi)=>{
    const u=Math.max(0,L-g.t0)+amb*25, d=1-Math.exp(-u/230), dd=d*d*(3-2*d);
    const op=g.o*dd*fade;if(op<=0.003)return;
    const par=1+(g.par-1)*dd, gk=cam.s+(g.k-cam.s)*dd;
    const ox=cam.x*par+80*Math.sin(gt*.05+gi)*dd, oy=g.y*(PORT.on?1.9:1)*dd+14*Math.sin(gt*.13+gi*1.7)*dd;
    const rd=g.r*dd, rr=rd*Math.PI/180, c=Math.cos(rr), sn=Math.sin(rr);
    const lx=((0-ox)*c+(0-oy)*sn)/gk;
    const base=arc+g.v*(u/25)*dd, sc=WAVE.arcAtX(lx);        // shape j sits where the main string's shape j sits, plus its own drift
    const n=Math.ceil(1500/(GAP*gk))+1, j0=Math.round((base-sc)/GAP);
    const T={x:ox,y:oy,r:rd,s:gk}, bl=g.b*dd;
    for(let j=j0-n;j<=j0+n;j++){
      const sArc=base-j*GAP;if(sArc<0||sArc>LTOT)continue;
      const R=RIG[((j%24)+24)%24], P=WAVE.at(sArc), cs=CS[R.k];
      const wx=ox+gk*(c*P.x-sn*P.y), wy=oy+gk*(sn*P.x+c*P.y);
      if(Math.abs(wx)>1250||Math.abs(wy)>850)continue;
      // copies of the 24 string shapes come first; the endless continuation only once the copy has clearly parted
      const oj=(j>=0&&j<24)?op:op*sstep(.45,.9,dd);if(oj<=0.003)continue;

function drawShapes(L,fr,arc,cam){
  ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,inner.width,inner.height);
  const ki=fitCss*iq, Ti=[ki,inner.width/2,inner.height/2];
  const S=RIG.map(R=>({R,s:rigState(R,L,fr,arc,cam)}));
  const fade=1-sstep(.05,.45,SCN.p4);
  const one=(ctx,e)=>{const s=e.s, o=(e.R.dup||e.R.k!=='astrix')?s.o*fade:s.o;blurShape(ctx,Ti,[s],e.R.k,o,Math.max(.3,s.sig),e.R.k==='astrix'?1.8:0);};
  const orig=k=>S.find(e=>!e.R.dup&&e.R.k===k);
  // asterisk under the framed shapes, as in SC02
  one(ictx,orig('astrix'));
  // "All shapes": wave, clover, small shapes (+ their copies), kept inside the Blur mask until it opens up at frame 200
  const grow=1+0.004929*Math.pow(Math.max(0,L-200),2);

  if(clip){sctx.setTransform(1,0,0,1,0,0);sctx.clearRect(0,0,shp.width,shp.height);}
  const group=['wave','clover'];

  for(const e of S)if(e.R.dup&&(group.includes(e.R.k)||isSmall(e.R.k)))one(tctx,e);
  if(clip){
    const fL=q12(Math.min(L,SCN.SC2_HOLD));
    const cs=L>200?cam.s:1, cx=L>200?cam.x:0;
    const mw=S2(M.mask.w,fL)*FRAME_SCALE*grow*cs*RMX, mh=S2(M.mask.h,fL)*FRAME_SCALE*grow*cs*RMY;
    const sg=MASK_SOFT*cs*ki, OFF=shp.width+4*sg+400;

// ---- WebGL compositor ----
// The mouse bends the ghost copies; the pixel grid is laid on after the bend, so the grid itself never warps.
// For SC04 the whole picture is magnified around the head asterisk (uZ*), the grain stays put.
const vs='attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
const fs=`
precision highp float;
varying vec2 v;
uniform sampler2D u4,u5,uF,uS,uI;
uniform vec2 uRes; uniform float uFit;
uniform vec2 uM; uniform float uMs; uniform vec2 uMv; uniform float uT;
uniform float uCell, uSeed, uGA;
uniform vec3 uBg;
uniform vec2 uZA, uZH; uniform float uZk;
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 toUV(vec2 c){return (c*uFit+.5*uRes)/uRes;}
vec4 A(vec2 c){return texture2D(u4,toUV(c));}
vec4 B(vec2 c){return texture2D(u5,toUV(c));}
const float NOISE_K=1.0, SAT=1.2;
float infl(vec2 x){vec2 dm=x-uM;return exp(-dot(dm,dm)/(2.*230.*230.))*uMs;}
vec2 warp(vec2 x){
  vec2 dm=x-uM; float inf=infl(x);
  float ang=.12*inf;
  return uM+mat2(cos(ang),-sin(ang),sin(ang),cos(ang))*dm*(1.-.04*inf)-uMv*inf*.55;
}
float grain(vec2 cp){
  float r=hash(cp+vec2(mod(uSeed*37.,1013.),mod(uSeed*71.,1019.)));
  return r<0.93?0.0:(r<0.957?(r-0.93)/0.027:1.0);
}

      const lA=aA.reduce((a,b)=>a+b,0), lB=aB.reduce((a,b)=>a+b,0), st=SCN.arc-lA-60-lag*.5;
      place(tr3,pick(SC3S.A,g3),aA,st,SC3S.A.map(i=>wk[w3i[i]]));
      place(tr3b,pick(SC3S.B,g3),aB,st+(lA-lB)/2,SC3S.B.map(i=>wk[w3i[i]]));
    }else place(tr3,g3,a3,SCN.arc-len3-300-lag,w3i.map(wi=>wk[wi]));
    setB(f3,.4);
  }
}
SCN.renderers.push(render);
})();
